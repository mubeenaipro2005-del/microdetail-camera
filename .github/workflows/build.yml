name: Build APK

on:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -q project.zip -d work

      - name: Run automated tests
        run: gradle -p work testDebugUnitTest --no-daemon

      - name: Build APK
        run: gradle -p work assembleDebug --no-daemon

      - name: Save APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroDetail-APK
          path: work/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to Releases (direct download link)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest-build
          name: Latest build
          body: Newest APK built automatically from project.zip
          files: work/app/build/outputs/apk/debug/*.apk
